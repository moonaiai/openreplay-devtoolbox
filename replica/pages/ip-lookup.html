<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IP 地址查询</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 18px; background: #fafaf9; color: #1c1917;
         font-family: "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 1000px; margin: 0 auto; }
  .card { background: #fff; border: 1px solid #e7e5e4; border-radius: 16px;
          box-shadow: 0 12px 30px rgba(17,17,17,.08); padding: 24px 28px; }
  .controls { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 14px; }
  .field { display: flex; flex-direction: column; gap: 6px; width: 320px; max-width: 100%; }
  .field span { font-size: 12.5px; font-weight: 600; color: #78716c; }
  input { width: 100%; height: 38px; padding: 0 12px; border: 1px solid #d6d3d1;
          border-radius: 10px; background: #fff; color: #1c1917; outline: none;
          font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
  input:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,.12); }
  button.primary { height: 38px; padding: 0 18px; border: 0; border-radius: 10px;
                   background: #4f46e5; color: #fff; font-weight: 650; font-size: 13.5px; cursor: pointer; }
  button.primary:hover { background: #4338ca; }
  #status { font-size: 12.5px; color: #78716c; padding-bottom: 9px; }
  table { width: 100%; margin-top: 24px; border-collapse: collapse; font-size: 13.5px; }
  tr { border-top: 1px solid #e7e5e4; }
  tr:first-child { border-top: 0; }
  td { padding: 10px 0; }
  td.label { width: 200px; color: #78716c; }
  td.value { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; word-break: break-all; }
  td.action { width: 70px; text-align: right; }
  button.copy { border: 0; background: transparent; color: #78716c; cursor: pointer; padding: 4px; border-radius: 6px; }
  button.copy:hover { background: #f5f5f4; color: #4f46e5; }
</style>
</head>
<body>
<main>
  <section class="card">
    <div class="controls">
      <label class="field">
        <span>IP 地址</span>
        <input id="ipInput" type="text" placeholder="留空查询当前 IP，例如 8.8.8.8" aria-label="IP 地址">
      </label>
      <button id="queryBtn" class="primary">查询</button>
      <span id="status">留空将查询当前出口 IP</span>
    </div>
    <table id="resultsTable">
      <tbody>
        <tr><td class="label">IP 地址</td><td class="value" id="out-ip">—</td><td class="action"><button class="copy" data-target="out-ip" aria-label="复制 IP 地址"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 9h11v11H9z"></path><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg></button></td></tr>
        <tr><td class="label">国家 / 地区</td><td class="value" id="out-country">—</td><td class="action"><button class="copy" data-target="out-country" aria-label="复制国家"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 9h11v11H9z"></path><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg></button></td></tr>
        <tr><td class="label">省 / 州</td><td class="value" id="out-region">—</td><td class="action"><button class="copy" data-target="out-region" aria-label="复制省州"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 9h11v11H9z"></path><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg></button></td></tr>
        <tr><td class="label">城市</td><td class="value" id="out-city">—</td><td class="action"><button class="copy" data-target="out-city" aria-label="复制城市"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 9h11v11H9z"></path><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg></button></td></tr>
        <tr><td class="label">经纬度</td><td class="value" id="out-coords">—</td><td class="action"><button class="copy" data-target="out-coords" aria-label="复制经纬度"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 9h11v11H9z"></path><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg></button></td></tr>
        <tr><td class="label">时区</td><td class="value" id="out-timezone">—</td><td class="action"><button class="copy" data-target="out-timezone" aria-label="复制时区"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 9h11v11H9z"></path><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg></button></td></tr>
        <tr><td class="label">ISP / 组织</td><td class="value" id="out-isp">—</td><td class="action"><button class="copy" data-target="out-isp" aria-label="复制 ISP"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 9h11v11H9z"></path><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg></button></td></tr>
        <tr><td class="label">ASN</td><td class="value" id="out-asn">—</td><td class="action"><button class="copy" data-target="out-asn" aria-label="复制 ASN"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 9h11v11H9z"></path><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg></button></td></tr>
        <tr><td class="label">查询来源</td><td class="value" id="out-source">ipwho.is</td><td class="action"></td></tr>
      </tbody>
    </table>
  </section>
</main>
<script src="ip-lookup.js"></script>
</body>
</html>
